[project]
name = "rumper-api"
version = "0.1.0"
description = "Rumper — AI research agent for location risk Mini Checks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "google-genai>=1.0",
    "httpx>=0.27",
    "langgraph>=1.2.4",
    "langsmith>=0.8.12",
    "pyjwt>=2.13.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "langchain-google-genai>=4.2.5",
    "langchain-core>=1.4.3",
    "reportlab>=4.5.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
